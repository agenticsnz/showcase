<!--
  The look of this page is not defined here. It is the Ghost site's own theme
  build, linked straight from agentics.org.nz, so the showcase inherits every
  change made over there without anything being copied across.

  Two faces have to be named rather than linked: the theme's stylesheet asks for
  Inter and Cardo but serves its own Inter copy without CORS headers, which a
  second origin cannot use. Cardo comes from the same CDN the Ghost site uses;
  Inter comes from Google as a variable font so the theme's 550 and 725 weights
  land exactly.
-->
<link rel="preconnect" href="https://fonts.bunny.net" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.bunny.net/css?family=cardo:400,700" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" />
<link rel="stylesheet" href="https://agentics.org.nz/assets/built/screen.css?v=7fc3363b3f" />

<style>
  /* The three values Ghost injects per-site rather than shipping in the theme.
     They mirror the Agentics NZ site's design settings. */
  :root {
    --ghost-accent-color: #Fe7240;
    --background-color: #ffffff;
    --gh-font-heading: Cardo;

    /* The category rail sits clear of the viewport edge; sections align to the
       same line. Read by the rail's scroll-spy, so it stays on :root. */
    --rail-top: 2.8rem;
  }
</style>

<style>
  /* Showcase-specific components (category rail, project cards, carousel).
     Every colour, face and size below resolves through a variable the Ghost
     theme defines, so this file states layout only — never a palette. */
  .showcase {
    --surface: var(--color-white);
    --surface-2: var(--color-lighter-gray);
    --text: var(--color-primary-text);
    --muted: var(--color-secondary-text);
    --border: var(--color-border);
    --accent: var(--ghost-accent-color);
    --accent-soft: color-mix(in srgb, var(--ghost-accent-color) 10%, var(--color-white));
    --shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    --mono: var(--font-mono);
  }

  .showcase { padding-bottom: 6.4rem; }

  /* Spacing above and below the title comes from the theme's own
     .gh-article-header, so the title sits on the same line as it does on any
     Ghost page. */
  .showcase-header .gh-article-excerpt {
    /* The theme caps an excerpt at its 720px reading column. This one heads a
       full-width gallery rather than an article, so it runs the same width. */
    max-width: none;
  }

  /* Ghost styles every link with the body text colour; inside the showcase the
     accent does the work instead. */
  .showcase a { color: var(--accent); }
  .showcase a:hover { text-decoration: underline; }

  /* ---- Sticky category rail + content ---- */
  .showcase .rail-layout {
    display: grid;
    grid-template-columns: 210px minmax(0, 1fr);
    gap: 5.6rem;
    align-items: start;
  }

  .showcase nav.rail {
    position: sticky;
    top: var(--rail-top);
    display: flex;
    flex-direction: column;
    padding-top: 1.36rem;
    border-top: 1px solid var(--border);
    /* A long category list scrolls within the rail rather than past the fold. */
    max-height: calc(100vh - var(--rail-top) * 2);
    overflow-y: auto;
  }
  .showcase .rail-label {
    padding-bottom: 0.88rem;
    font-family: var(--mono);
    font-size: 1.12rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .showcase nav.rail a {
    display: grid;
    grid-template-columns: 2.4rem minmax(0, 1fr) auto;
    gap: 0.88rem;
    align-items: baseline;
    padding: 0.8rem 0 0.8rem 1.12rem;
    border-left: 2px solid transparent;
    font-size: 1.4rem;
    line-height: 1.35;
    color: var(--text);
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .showcase nav.rail a:hover {
    color: var(--accent);
    text-decoration: none;
  }
  .showcase nav.rail a[aria-current="true"] {
    border-left-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .showcase nav.rail a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .showcase .rail-num {
    font-family: var(--mono);
    font-size: 1.152rem;
    color: var(--accent);
    opacity: 0.7;
  }
  .showcase nav.rail a[aria-current="true"] .rail-num { opacity: 1; }
  .showcase .rail-count {
    font-size: 1.2rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* Below the breakpoint the rail stops earning its column and becomes the
     horizontal pill row it replaced. */
  @media (max-width: 900px) {
    .showcase .rail-layout { display: block; }
    .showcase nav.rail {
      position: static;
      max-height: none;
      overflow: visible;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 0.8rem;
      border-top: 0;
      padding-top: 0;
      margin-bottom: 3.2rem;
    }
    .showcase .rail-label { display: none; }
    .showcase nav.rail a {
      display: inline-flex;
      align-items: center;
      gap: 0.56rem;
      padding: 0.56rem 1.36rem;
      border: 1px solid var(--border);
      border-radius: 9999px;
      background: var(--surface);
      font-size: 1.36rem;
      color: var(--muted);
    }
    .showcase nav.rail a[aria-current="true"] {
      border-color: var(--accent);
      color: var(--accent);
    }
    .showcase .rail-num { display: none; }
  }

  .showcase section.category {
    margin-bottom: 4.8rem;
    scroll-margin-top: var(--rail-top);
  }
  .showcase section.category > header {
    margin-bottom: 2rem;
  }
  .showcase section.category h2 {
    font-size: 2.4rem;
    margin: 0 0 0.4rem;
    letter-spacing: -0.01em;
  }
  .showcase section.category .intro {
    color: var(--muted);
    margin: 0;
  }

  .showcase .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 2rem;
  }
  /* Two columns need roughly 400px each to hold a card's meta rows; below that
     the grid drops to one. */
  @media (max-width: 860px) {
    .showcase .grid {
      grid-template-columns: minmax(0, 1fr);
    }
  }

  .showcase article.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .showcase article.card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow);
    border-color: color-mix(in oklab, var(--accent) 40%, var(--border));
  }
  .showcase section.category.featured article.card {
    border-color: color-mix(in oklab, var(--accent) 55%, var(--border));
    box-shadow: 0 0 0 1px color-mix(in oklab, var(--accent) 35%, transparent), var(--shadow);
  }
  .showcase section.category.featured article.card:hover {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px color-mix(in oklab, var(--accent) 45%, transparent), var(--shadow);
  }
  .showcase section.category.featured .grid {
    grid-template-columns: 1fr;
  }
  @media (min-width: 720px) {
    .showcase section.category.featured article.card {
      display: grid;
      grid-template-columns: 50% minmax(0, 1fr);
      grid-template-areas:
        "head head"
        "thumb body";
    }
    /* A featured entry without a screenshot keeps a single column rather than
       leaving the image half of the row empty. */
    .showcase section.category.featured article.card:not(:has(.thumb)) {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas:
        "head"
        "body";
    }
    .showcase section.category.featured article.card .head {
      grid-area: head;
      padding: 2.4rem 2.8rem 0;
    }
    .showcase section.category.featured article.card .thumb {
      grid-area: thumb;
      aspect-ratio: auto;
    }
    .showcase section.category.featured article.card .thumb img {
      object-fit: contain;
    }
    .showcase section.category.featured article.card .body {
      grid-area: body;
      padding: 0 2.8rem 2.4rem;
    }
    .showcase section.category.featured article.card h3 {
      font-size: 2.24rem;
    }
  }

  /* ---- Featured carousel ---- */
  .showcase .carousel {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 1.2rem 0.96rem;
  }
  .showcase .carousel-viewport {
    grid-row: 1;
    grid-column: 2;
    overflow: hidden;
  }
  .showcase .carousel-track {
    display: flex;
    transition: transform 0.5s ease;
    will-change: transform;
  }
  .showcase .carousel-slide {
    flex: 0 0 100%;
    min-width: 0;
    /* Inset on the slide (not the viewport) keeps the featured card's focus
       ring from being clipped, leaves the card comfortably inside the hover
       target so mouseenter/leave don't oscillate, and avoids a sliver of the
       next slide peeking past the viewport edge. */
    padding: 6px;
    /* Stretch every card to the height of the tallest slide so the carousel
       doesn't change height as it rotates. */
    display: flex;
  }
  .showcase .carousel-slide > .card {
    flex: 1 1 auto;
    min-width: 0;
  }
  .showcase .carousel-arrow {
    grid-row: 1;
    width: 4rem;
    height: 4rem;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 9999px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .showcase .carousel-arrow:hover {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .showcase .carousel-arrow:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .showcase .carousel-arrow svg {
    width: 1.76rem;
    height: 1.76rem;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .showcase .carousel-arrow[data-dir="-1"] { grid-column: 1; }
  .showcase .carousel-arrow[data-dir="1"] { grid-column: 3; }
  .showcase .carousel-dots {
    grid-row: 2;
    grid-column: 1 / -1;
    display: flex;
    justify-content: center;
    gap: 0.72rem;
  }
  .showcase .carousel-dot {
    width: 0.88rem;
    height: 0.88rem;
    padding: 0;
    border: 0;
    border-radius: 9999px;
    background: var(--border);
    cursor: pointer;
    transition: background-color 0.15s ease, transform 0.15s ease;
  }
  .showcase .carousel-dot:hover { background: var(--muted); }
  .showcase .carousel-dot[aria-current="true"] {
    background: var(--accent);
    transform: scale(1.2);
  }
  @media (prefers-reduced-motion: reduce) {
    .showcase .carousel-track { transition: none; }
  }

  .showcase article.card .thumb {
    aspect-ratio: 16 / 9;
    background: var(--surface-2);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .showcase article.card .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .showcase article.card .head {
    order: 2;
    padding: 1.6rem 1.76rem 0;
  }
  .showcase article.card .thumb { order: 1; }
  .showcase article.card .body {
    order: 3;
    padding: 0 1.76rem 1.76rem;
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  .showcase article.card h3 {
    margin: 0 0 0.64rem;
    font-size: 1.76rem;
    letter-spacing: -0.01em;
  }
  .showcase article.card .tagline {
    margin: 0 0 1.44rem;
    color: var(--text);
  }
  .showcase article.card .meta {
    display: grid;
    gap: 0.64rem;
    margin: 0 0 1.6rem;
    font-size: 1.44rem;
  }
  .showcase article.card .meta .row {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 0.8rem;
  }
  .showcase article.card .meta .row dt {
    color: var(--muted);
    margin: 0;
  }
  .showcase article.card .meta .row dd {
    margin: 0;
    color: var(--text);
  }
  .showcase article.card .meta .row dd code {
    background: var(--surface-2);
    padding: 0.08rem 0.48rem;
    border-radius: 4px;
    font-size: 0.85em;
  }
  .showcase article.card .links {
    margin-top: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 0.64rem;
  }
  .showcase article.card .links a {
    display: inline-flex;
    align-items: center;
    gap: 0.48rem;
    padding: 0.56rem 1.12rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 9999px;
    font-size: 1.36rem;
    color: var(--text);
  }
  .showcase article.card .links a:hover {
    border-color: var(--accent);
    color: var(--accent);
    text-decoration: none;
  }
  .showcase article.card .links a svg.icon {
    width: 1em;
    height: 1em;
    flex-shrink: 0;
    fill: currentColor;
  }

  .showcase p.loading, .showcase p.error {
    color: var(--muted);
    padding: 3.2rem 0;
    text-align: center;
  }
  .showcase p.error {
    color: #dc2626;
  }
</style>

<script>
(() => {
  // ---- README fetch + parse ----
  const IGNORED_SECTIONS = new Set(['categories', 'adding your project']);

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function renderInline(md) {
    let s = escapeHtml(md);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, text, url) => {
      const external = /^https?:/.test(url);
      const attrs = external ? ' target="_blank" rel="noopener"' : '';
      return `<a href="${url}"${attrs}>${text}</a>`;
    });
    return s;
  }

  // Split README into logical sections on horizontal rules.
  function splitSections(md) {
    // Normalise newlines and split on --- lines.
    const lines = md.replace(/\r\n/g, '\n').split('\n');
    const sections = [];
    let current = [];
    for (const line of lines) {
      if (/^\s*---\s*$/.test(line)) {
        if (current.length) sections.push(current.join('\n'));
        current = [];
      } else {
        current.push(line);
      }
    }
    if (current.length) sections.push(current.join('\n'));
    return sections;
  }

  function parseProject(section, category) {
    const lines = section.split('\n');
    const first = lines.find(l => l.trim().startsWith('### '));
    if (!first) return null;
    const name = first.replace(/^###\s+/, '').trim();

    // Image (first markdown image).
    const imgMatch = section.match(/!\[([^\]]*)\]\(([^)]+)\)/);
    const image = imgMatch ? { alt: imgMatch[1], src: imgMatch[2] } : null;

    // Find tagline: first non-empty, non-heading, non-image, non-bold-field line(s).
    const body = section.replace(first, '').trim();
    const paragraphs = body.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);

    let tagline = '';
    const fields = {};
    const links = [];

    for (const p of paragraphs) {
      // Skip pure image paragraphs.
      if (/^!\[[^\]]*\]\([^)]+\)\s*$/.test(p)) continue;

      // Bold-prefixed field, e.g. **Stack:** ...
      const fieldMatch = p.match(/^\*\*([^:*]+):\*\*\s*([\s\S]*)$/);
      if (fieldMatch) {
        const key = fieldMatch[1].trim().toLowerCase();
        const value = fieldMatch[2].trim();
        if (key === 'links') {
          // The list items may be on subsequent lines within this paragraph.
          const listLines = value.split('\n').map(l => l.trim()).filter(l => l.startsWith('-'));
          for (const l of listLines) {
            const item = l.replace(/^-\s*/, '');
            const linkMatch = item.match(/^(\S+)\s*(.*?)\[([^\]]+)\]\(([^)\s]+)\)/);
            if (linkMatch) {
              links.push({
                emoji: linkMatch[1],
                label: (linkMatch[2] || '').replace(/:\s*$/, '').trim(),
                text: linkMatch[3],
                url: linkMatch[4],
              });
            } else {
              const fallback = item.match(/\[([^\]]+)\]\(([^)\s]+)\)/);
              if (fallback) {
                links.push({ emoji: '', label: '', text: fallback[1], url: fallback[2] });
              }
            }
          }
          continue;
        }
        fields[key] = value;
        continue;
      }

      // List-only paragraph (Links: block sometimes separated).
      if (/^-\s+/.test(p)) {
        const listLines = p.split('\n').map(l => l.trim()).filter(l => l.startsWith('-'));
        for (const l of listLines) {
          const item = l.replace(/^-\s*/, '');
          const linkMatch = item.match(/^(\S+)\s*(.*?)\[([^\]]+)\]\(([^)\s]+)\)/);
          if (linkMatch) {
            links.push({
              emoji: linkMatch[1],
              label: (linkMatch[2] || '').replace(/:\s*$/, '').trim(),
              text: linkMatch[3],
              url: linkMatch[4],
            });
          }
        }
        continue;
      }

      if (!tagline) tagline = p;
    }

    return { name, category, image, tagline, fields, links };
  }

  function parse(md) {
    const sections = splitSections(md);
    const categories = [];
    let current = null;

    for (const section of sections) {
      // Strip fenced code blocks so template snippets inside ``` ``` don't confuse heading detection.
      const trimmed = section.replace(/```[\s\S]*?```/g, '').trim();
      if (!trimmed) continue;

      const h2 = trimmed.match(/^##\s+(.+)$/m);
      const h3 = trimmed.match(/^###\s+(.+)$/m);

      if (h2) {
        const name = h2[1].trim();
        if (IGNORED_SECTIONS.has(name.toLowerCase())) {
          current = null;
          continue;
        }
        const intro = trimmed.replace(h2[0], '').trim();
        current = { name, intro, projects: [] };
        categories.push(current);
        continue;
      }

      if (h3) {
        if (!current) continue;
        const project = parseProject(trimmed, current.name);
        if (project) current.projects.push(project);
      }
    }

    return categories.filter(c => c.projects.length > 0);
  }

  // ---- Render ----
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function slugify(s) {
    return s.toLowerCase().trim()
      .replace(/[^\w\s-]/g, '')
      .replace(/\s+/g, '-');
  }

  function renderCard(project) {
    const img = project.image
      ? `<div class="thumb"><img src="${escapeHtml(project.image.src)}" alt="${escapeHtml(project.image.alt)}" loading="lazy" /></div>`
      : '';

    const rows = [];
    if (project.fields.description) {
      rows.push(`<div class="row"><dt>About</dt><dd>${renderInline(project.fields.description)}</dd></div>`);
    }
    if (project.fields.stack) {
      rows.push(`<div class="row"><dt>Stack</dt><dd>${renderInline(project.fields.stack)}</dd></div>`);
    }
    if (project.fields.builder) {
      rows.push(`<div class="row"><dt>Builder</dt><dd>${renderInline(project.fields.builder)}</dd></div>`);
    }

    const linkChips = project.links.map(l => {
      const labelText = l.text || l.label || l.url;
      const githubIcon = '<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>';
      const isGithub = l.emoji === '🐙' || /github\.com/i.test(l.url);
      const prefix = isGithub
        ? githubIcon
        : (l.emoji ? escapeHtml(l.emoji) : '');
      return `<a href="${escapeHtml(l.url)}" target="_blank" rel="noopener">${prefix}${prefix ? ' ' : ''}${escapeHtml(labelText)}</a>`;
    }).join('');

    return `
      <article class="card">
        <div class="head">
          <h3>${escapeHtml(project.name)}</h3>
          ${project.tagline ? `<p class="tagline">${renderInline(project.tagline)}</p>` : ''}
        </div>
        ${img}
        <div class="body">
          <dl class="meta">${rows.join('')}</dl>
          ${linkChips ? `<div class="links">${linkChips}</div>` : ''}
        </div>
      </article>
    `;
  }

  function render(categories) {
    const rail = document.getElementById('rail');
    const label = rail.querySelector('.rail-label');
    rail.innerHTML = '';
    if (label) rail.appendChild(label);
    rail.insertAdjacentHTML('beforeend', categories
      .map((c, i) => `<a href="#${slugify(c.name)}">`
        + `<span class="rail-num" aria-hidden="true">${String(i + 1).padStart(2, '0')}</span>`
        + `<span class="rail-name">${escapeHtml(c.name)}</span>`
        + `<span class="rail-count">${c.projects.length}</span></a>`)
      .join(''));

    const content = document.getElementById('content');
    content.innerHTML = categories.map(c => {
      const isFeatured = c.name.toLowerCase() === 'featured';
      const body = isFeatured
        ? renderCarousel(c)
        : `<div class="grid">${c.projects.map(renderCard).join('')}</div>`;
      return `
      <section class="category${isFeatured ? ' featured' : ''}" id="${slugify(c.name)}">
        <header>
          <h2>${escapeHtml(c.name)}</h2>
          ${c.intro ? `<p class="intro">${renderInline(c.intro)}</p>` : ''}
        </header>
        ${body}
      </section>
    `;
    }).join('');

    initCarousels(content);
    initRailHighlight();
  }

  // ---- Rail scroll highlight ----
  // The rail marks the section the reader is currently in: the last one whose
  // top has passed the rail's own sticky line.
  function initRailHighlight() {
    const links = Array.from(document.querySelectorAll('nav.rail a'));
    if (!links.length) return;

    const targets = links
      .map(a => ({ link: a, section: document.getElementById(decodeURIComponent(a.hash.slice(1))) }))
      .filter(t => t.section);

    let current = null;
    function update() {
      // Matches section.category's scroll-margin-top, plus a little slack so a
      // section counts as current just before its heading reaches the line.
      const styles = getComputedStyle(document.documentElement);
      const rem = parseFloat(styles.fontSize) || 16;
      const line = parseFloat(styles.getPropertyValue('--rail-top')) * rem + 24;
      let active = targets[0];
      for (const t of targets) {
        if (t.section.getBoundingClientRect().top <= line) active = t;
      }
      // At the very bottom the last section is current even if it never
      // reaches the line.
      if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 2) {
        active = targets[targets.length - 1];
      }
      if (active === current) return;
      if (current) current.link.removeAttribute('aria-current');
      active.link.setAttribute('aria-current', 'true');
      current = active;
    }

    let ticking = false;
    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => { ticking = false; update(); });
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    update();
  }

  // ---- Featured carousel ----
  const CHEVRON_LEFT = '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>';
  const CHEVRON_RIGHT = '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';

  function renderCarousel(c) {
    const slides = c.projects
      .map(p => `<div class="carousel-slide">${renderCard(p)}</div>`)
      .join('');
    return `
      <div class="carousel" data-carousel data-interval="5000"
           role="group" aria-roledescription="carousel" aria-label="${escapeHtml(c.name)} projects">
        <button class="carousel-arrow" type="button" data-dir="-1" aria-label="Previous project">${CHEVRON_LEFT}</button>
        <div class="carousel-viewport">
          <div class="carousel-track">${slides}</div>
        </div>
        <button class="carousel-arrow" type="button" data-dir="1" aria-label="Next project">${CHEVRON_RIGHT}</button>
        <div class="carousel-dots" role="tablist" aria-label="Select project"></div>
      </div>
    `;
  }

  function initCarousels(scope) {
    (scope || document).querySelectorAll('[data-carousel]').forEach(setupCarousel);
  }

  function setupCarousel(el) {
    const track = el.querySelector('.carousel-track');
    const slides = Array.from(track.children);
    const prev = el.querySelector('[data-dir="-1"]');
    const next = el.querySelector('[data-dir="1"]');
    const dotsWrap = el.querySelector('.carousel-dots');
    const interval = parseInt(el.dataset.interval, 10) || 5000;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // A single slide needs no controls or rotation.
    if (slides.length <= 1) {
      [prev, next, dotsWrap].forEach(n => n && (n.style.display = 'none'));
      return;
    }

    let index = 0;
    let timer = null;

    const dots = slides.map((_, i) => {
      const b = document.createElement('button');
      b.className = 'carousel-dot';
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-label', `Project ${i + 1} of ${slides.length}`);
      b.addEventListener('click', () => { goTo(i); restart(); });
      dotsWrap.appendChild(b);
      return b;
    });

    function goTo(i) {
      index = (i + slides.length) % slides.length;
      track.style.transform = `translateX(-${index * 100}%)`;
      dots.forEach((d, di) => d.setAttribute('aria-current', di === index ? 'true' : 'false'));
      slides.forEach((s, si) => s.setAttribute('aria-hidden', si === index ? 'false' : 'true'));
    }
    function step(dir) { goTo(index + dir); }

    // Whether autoplay should hold right now. Queried live at each tick from the
    // browser's own :hover / focus / visibility state — NOT from mouseenter/leave
    // events, which are missed when a slide animates under a stationary pointer
    // (that was why hovering didn't reliably pause the carousel).
    function shouldHold() {
      return document.hidden
        || el.matches(':hover')
        || el.contains(document.activeElement);
    }

    function start() {
      if (reduceMotion || timer) return;
      timer = setInterval(() => { if (!shouldHold()) step(1); }, interval);
    }
    function restart() {
      // Reset the interval phase after a manual jump.
      if (timer) { clearInterval(timer); timer = null; }
      start();
    }

    prev.addEventListener('click', () => { step(-1); restart(); });
    next.addEventListener('click', () => { step(1); restart(); });

    goTo(0);
    start();
  }

  async function load() {
    try {
      const res = await fetch('./README.md', { cache: 'no-cache' });
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      const md = await res.text();
      const categories = parse(md);
      // Pin "Featured" to the top, and don't shuffle it.
      categories.sort((a, b) => {
        const af = a.name.toLowerCase() === 'featured' ? 0 : 1;
        const bf = b.name.toLowerCase() === 'featured' ? 0 : 1;
        return af - bf;
      });
      categories.forEach(c => {
        if (c.name.toLowerCase() !== 'featured') shuffle(c.projects);
      });
      if (!categories.length) {
        document.getElementById('content').innerHTML = '<p class="error">No projects found in README.md</p>';
        return;
      }
      render(categories);
    } catch (err) {
      document.getElementById('content').innerHTML = `<p class="error">Failed to load README: ${escapeHtml(String(err.message || err))}</p>`;
    }
  }

  load();
})();
</script>
</body>
</html>
